services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gresca-app
    restart: always
    ports:
      - "80:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-gresca_track}
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: gresca-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-gresca_track}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
